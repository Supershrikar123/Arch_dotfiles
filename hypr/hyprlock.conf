# ~/.config/hypr/hyprlock.conf
# Blue Vibe Lock Screen (Windows-Inspired Layout)

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fail_timeout = 250
}

animations {
    enabled = true
    bezier = soft, 0.16, 1.00, 0.30, 1.00

    animation = fade, 1, 1.2, soft
    animation = inputFieldDots, 1, 0.8, soft
    animation = inputFieldColors, 1, 0.7, soft
}

# ------------------------------------------------------------
# BACKGROUND
# ------------------------------------------------------------

background {
    monitor =
    path = screenshot
    color = rgb(25, 36, 42)

    # Strong privacy blur for underlying applications
    blur_passes = 4
    blur_size = 8
    
    # Dark acrylic styling
    brightness = 0.20
    contrast = 1.15
    vibrancy = 0.05
    vibrancy_darkness = 0.35
    noise = 0.005
}

# ------------------------------------------------------------
# TIME GROUP (Upper-Left Windows Layout)
# ------------------------------------------------------------

# Digital Clock
label {
    monitor =
    text = $TIME12
    color = rgb(156, 222, 242)
    font_size = 80
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 60, -50
    halign = left
    valign = top
}

# Date Display
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgb(120, 190, 199)
    font_size = 20
    font_family = JetBrainsMono Nerd Font

    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)

    position = 68, -165
    halign = left
    valign = top
}

# Clock Accent Line
shape {
    monitor =
    size = 70, 3
    color = rgba(97, 175, 239, 0.85)
    rounding = -1

    position = 70, -205
    halign = left
    valign = top
}

# ------------------------------------------------------------
# LOGIN GROUP (Centered Acrylic Card)
# ------------------------------------------------------------

# Main Login Container Base
shape {
    monitor =
    size = 400, 260
    color = rgba(31, 45, 52, 0.65)
    rounding = 16
    border_size = 1
    border_color = rgba(97, 175, 239, 0.25)

    shadow_passes = 3
    shadow_size = 25
    shadow_color = rgba(0, 0, 0, 0.5)
    shadow_boost = 1.2

    position = 0, 0
    halign = center
    valign = center
}

# Session User Header
label {
    monitor =
    text = $USER
    color = rgb(156, 222, 242)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 75
    halign = center
    valign = center
}

# Status Subtitle
label {
    monitor =
    text = Signed in
    color = rgba(120, 190, 199, 0.75)
    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = 0, 50
    halign = center
    valign = center
}

# Password Input Module
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    rounding = 8

    outer_color = rgba(97, 175, 239, 0.6)
    inner_color = rgba(20, 28, 33, 0.95)
    font_color = rgb(156, 222, 242)
    font_family = JetBrainsMono Nerd Font

    check_color = rgba(86, 182, 194, 0.85)
    fail_color = rgba(224, 108, 117, 0.85)
    capslock_color = rgba(250, 179, 135, 0.9)

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    hide_input = false
    fade_on_empty = false
    
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -10
    halign = center
    valign = center
}

# Bottom Interaction Hint
label {
    monitor =
    text = Press Enter to unlock
    color = rgba(120, 190, 199, 0.55)
    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = 0, -70
    halign = center
    valign = center
}

# ------------------------------------------------------------
# SYSTEM STATUS FOOTER
# ------------------------------------------------------------

label {
    monitor =
    text = Blue Vibe
    color = rgba(97, 175, 239, 0.6)
    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = 30, 25
    halign = left
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(120, 190, 199, 0.5)
    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = -30, 25
    halign = right
    valign = bottom
}